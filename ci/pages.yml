name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tweego
        run: |
          curl -fsSL -o tweego.zip \
            "https://github.com/tmedwards/tweego/releases/download/v2.1.1/tweego-2.1.1-linux-x64.zip"
          unzip -o tweego.zip -d "$HOME/tweego"
          # Zip layout varies; find the binary
          BIN="$(find "$HOME/tweego" -type f -name tweego | head -n1)"
          chmod +x "$BIN"
          mkdir -p "$HOME/bin"
          ln -sf "$BIN" "$HOME/bin/tweego"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # Story formats: SugarCube ships with Tweego releases often under storyformats
          if [ -d "$(dirname "$BIN")/storyformats" ]; then
            echo "TWEEGO_PATH=$(dirname "$BIN")/storyformats" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: ./scripts/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
